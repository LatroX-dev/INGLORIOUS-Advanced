name: Build and verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  source-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Use a canonical temporary directory
        if: runner.os != 'Windows'
        shell: bash
        run: |
          temp="$(cd "$RUNNER_TEMP" && pwd -P)/inglorious-tests"
          mkdir -p "$temp"
          echo "TMPDIR=$temp" >> "$GITHUB_ENV"
      - name: Check source without firmware assets or hardware
        shell: pwsh
        run: ./scripts/Build-PublicRelease.ps1 -Mode SourceChecks
      - name: Check public release asset selection
        run: python tests/ReleaseAssetsChecks/check_release_assets.py

  windows:
    needs: source-checks
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build reviewed firmware and Windows application
        shell: pwsh
        run: ./scripts/Build-PublicRelease.ps1 -Mode Windows
      - name: Stage only reviewed firmware for the native platform builds
        shell: pwsh
        run: |
          $catalog = Get-Content src/InGlorious.Core/SetupFirmwareCatalog.json -Raw | ConvertFrom-Json
          if ($catalog.targets.Count -ne 15) { throw 'Unexpected firmware catalog.' }
          New-Item -ItemType Directory artifacts/reviewed-firmware | Out-Null
          foreach ($item in $catalog.targets) {
            $file = Join-Path artifacts/public-build/firmware $item.file
            if ((Get-Item -LiteralPath $file).Length -ne $item.bytes -or (Get-FileHash -LiteralPath $file).Hash -cne $item.sha256) { throw 'Unreviewed firmware output.' }
            Copy-Item -LiteralPath $file -Destination artifacts/reviewed-firmware
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewed-firmware-internal
          if-no-files-found: error
          retention-days: 3
          path: artifacts/reviewed-firmware/*.bin
      - name: Verify installation package without launching it
        shell: pwsh
        run: ./scripts/Test-WindowsInstaller.ps1 -AppHost 'artifacts/public-build/application/INGLORIOUS Advanced.exe' -ToolCatalogPath artifacts/public-build/SetupToolCatalog.json
      - name: Verify native install, update, uninstall and running-app protection
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/InGlorious.Core/InGlorious.Core.csproj
          $version = $project.Project.PropertyGroup.Version
          ./scripts/Test-NativeWindowsInstaller.ps1 -PackageDirectory "artifacts/public-build/INGLORIOUS-Advanced-$version-win-x64" -ToolCatalogPath artifacts/public-build/SetupToolCatalog.json -OutputDirectory artifacts/native-installer-checks
      - name: Prepare corresponding source
        shell: pwsh
        run: |
          $publicSource = Join-Path $env:RUNNER_TEMP 'inglorious-public-source'
          ./scripts/Export-PublicSource.ps1 -Destination $publicSource -Export
          [xml]$project = Get-Content src/InGlorious.Core/InGlorious.Core.csproj
          $version = $project.Project.PropertyGroup.Version
          ./scripts/New-CorrespondingSource.ps1 -PublicSourceDirectory $publicSource -Destination "artifacts/INGLORIOUS-Advanced-$version-Source" -Download
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-and-source
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/public-build/installer/INGLORIOUS-Advanced-*-Setup.exe
            artifacts/public-build/installer/INGLORIOUS-Advanced-*-Setup.exe.sha256
            artifacts/INGLORIOUS-Advanced-*-Source.zip
            artifacts/INGLORIOUS-Advanced-*-Source.zip.sha256

  native-desktop:
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: reviewed-firmware-internal
          path: artifacts/reviewed-firmware
      - name: Install native Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config patchelf xvfb libfontconfig1 libx11-6 libxrandr2 libxi6 libgl1
      - name: Use a canonical temporary directory
        shell: bash
        run: |
          temp="$(cd "$RUNNER_TEMP" && pwd -P)/inglorious-tests"
          mkdir -p "$temp"
          echo "TMPDIR=$temp" >> "$GITHUB_ENV"
      - name: Build full native app, firmware tools and package
        shell: pwsh
        env:
          NATIVE_RUNTIME: ${{ matrix.runtime }}
        run: |
          ./scripts/Build-DesktopRelease.ps1 -Runtime $env:NATIVE_RUNTIME -FirmwareDirectory artifacts/reviewed-firmware
      - name: Keep native offline screenshots for visual review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots-${{ matrix.runtime }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/desktop-release/screenshots/*.png
            artifacts/desktop-release/screenshots/provenance.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.runtime }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/desktop-release/INGLORIOUS-Advanced-*.tar.gz
            artifacts/desktop-release/INGLORIOUS-Advanced-*.tar.gz.sha256

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, native-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-and-source
          path: release-files/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: release-files/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-osx-x64
          path: release-files/macos-intel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-osx-arm64
          path: release-files/macos-arm
      - name: Create an unpublished alpha release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          version = re.fullmatch(r'v(\d+\.\d+\.\d+)', os.environ['RELEASE_TAG'])
          if not version:
              raise SystemExit('Unsupported release tag')
          subprocess.run(['python', 'scripts/Prepare-ReleaseAssets.py', '--input', 'release-files', '--output', 'release-ready', '--version', version[1]], check=True)
          PY
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "INGLORIOUS Advanced $RELEASE_TAG" --notes-file release-ready/release-notes.md
          find release-ready -maxdepth 1 -type f ! -name 'release-notes.md' -print0 | xargs -0 gh release upload "$RELEASE_TAG" --
